[project]
name = "jobintel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# SQLAlchemy's own warnings, including deprecations, fail the run so they surface in
# CI (which installs the newest release) instead of scrolling past in the log.
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
